mode: paper

chains:
  solana:
    enabled: true
    # Path to your Solana keypair file (Solana CLI JSON format — 64-byte array).
    # Can be an absolute path anywhere on the machine; does not need to be
    # inside the project directory. Only read in live mode.
    walletFile: ./wallet/chain-solana.txt
    # Name of the env var holding your Solana RPC URL (Helius, QuickNode, etc.).
    # Required for live trading and for on-chain risk signals in paper mode
    # (mint authority revocation, holder concentration, top-5 holder %).
    # Example: export SOLANA_RPC_URL=https://mainnet.helius-rpc.com/?api-key=<key>
    rpcUrlEnv: SOLANA_RPC_URL
    minLiquidityUsd: 10000
    minVolume5mUsd: 5000
    maxSlippageBps: 500
    maxPriceImpactBps: 500
    minSolFeeReserveLamports: 5000000
    # Dynamic priority fee — lets Jupiter set the fee based on current network
    # congestion. Switch to a fixed number (lamports) during low-traffic periods.
    priorityFeeLamports: auto
    confirmationCommitment: confirmed

paper:
  startingBalanceUsd: 1000
  positionSizeUsd: 25
  maxOpenPositions: 3
  maxDailyLossUsd: 100

exits:
  # Hard floor — exit immediately if down this much from entry (phase 1 and 2).
  stopLossPct: 20
  # Safety ceiling — set high so the trailing stop is the real exit, not this.
  # A 50% fixed TP is wrong for memecoins that can run 200-1000%.
  takeProfitPct: 300
  # How far price may fall from the high-water mark before exiting (phase 2).
  trailingStopPct: 15
  # Trailing stop only arms once position is up this much. Below this threshold,
  # only the hard stop-loss applies — gives the trade room to breathe.
  trailingArmPct: 30
  # Extended from 45m to give momentum plays time to develop.
  maxHoldMinutes: 60

# Paper fill cost model. swapFeeBps is charged per leg (entry and exit) for
# swap + priority fees; applyRouteSlippage also charges the candidate's estimated
# route price impact per leg so thin-liquidity PnL is not frictionless fantasy.
fees:
  swapFeeBps: 30
  applyRouteSlippage: true

scoring:
  minimumScoreToEnter: 75

# Data retention. `prune` deletes scored candidates older than this that never
# led to a position (trades are always kept). Also the counterfactual window for
# the `outcomes` report.
retention:
  scoredCandidateDays: 30
